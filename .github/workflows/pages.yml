name: Deploy web (local mode) to GitHub Pages

on:
  push:
    branches: [main, claude/happy-ride-lgtngm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let in-progress runs finish rather than
# cancelling them mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/configure-pages below can only ever *try* to switch a repo's
      # Pages source to "GitHub Actions" — doing so needs Administration:write,
      # which the default GITHUB_TOKEN never has, so a stale "Deploy from a
      # branch" setting fails that step silently. When that happens, GitHub's
      # own legacy branch/Jekyll build keeps racing with (and overriding) this
      # deploy on the live site, even though every step below still reports
      # success. Fail loudly here instead of finding out from the live site.
      - name: Verify Pages source is "GitHub Actions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.build_type // "unknown"')
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages 'Source' is set to '$build_type', not 'GitHub Actions' — go to https://github.com/${{ github.repository }}/settings/pages, under Build and deployment -> Source, choose 'GitHub Actions'. Until that's fixed, GitHub's own legacy branch build overrides this deploy and the live site shows the raw repo instead of the app."
            exit 1
          fi
          echo "GitHub Pages source is 'GitHub Actions' — good."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export (local data mode)
        run: pnpm --filter @bower/web build
        env:
          NEXT_PUBLIC_DATA_MODE: local
          NEXT_PUBLIC_BASE_PATH: /Wedding-Planner

      # Without this, GitHub Pages' default Jekyll processing ignores any
      # file/folder starting with "_" — including Next's entire `_next/`
      # asset directory — which would 404 every JS/CSS chunk on the live site.
      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
